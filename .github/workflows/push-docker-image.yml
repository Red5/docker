name: Push Docker Image

on:
  workflow_call:
    inputs:
      version:
        description: The version of Red5 Server to be pushed
        type: string
        required: true
    secrets:
      dockerhub-password:
        description: Docker Hub password
        required: true
      dockerhub-username:
        description: Docker Hub username
        required: true
      dockerhub-repository:
        description: Docker Hub repository (e.g., username/repository)
        required: true

jobs:
  retrieve-version-parts:
    if: github.repository == 'Red5/red5-server'
    runs-on: ubuntu-24.04
    outputs:
      major-version: ${{ steps.split.outputs.major }}
      minor-version: ${{ steps.split.outputs.minor }}
      patch-version: ${{ steps.split.outputs.patch }}
    steps:
      - name: Retrieve version parts
        id: split
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          version="${RELEASE_TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          {
            echo "major=${BASH_REMATCH[1]}"
            echo "minor=${BASH_REMATCH[2]}"
            echo "patch=${BASH_REMATCH[3]}"
          } >> "$GITHUB_OUTPUT"

  push-docker-image:
    if: github.repository == 'Red5/red5-server'
    runs-on: ubuntu-24.04
    needs: retrieve-version-parts
    steps:
      - uses: actions/checkout@v6
        with:
          repository: 'Red5/docker'
          path: docker-repo
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          password: ${{ secrets.dockerhub-password }}
          username: ${{ secrets.dockerhub-username }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        env:
          RED5_VERSION: ${{ needs.retrieve-version-parts.outputs.major-version }}.${{needs.retrieve-version-parts.outputs.minor-version}}.${{ needs.retrieve-version-parts.outputs.patch-version }}
        with:
          build-args: |
            RED5_VERSION=${{ env.RED5_VERSION }}
          context: .
          file: ./docker-repo/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.dockerhub-repository }}:${{ env.RED5_VERSION }}
            ${{ secrets.dockerhub-repository }}:${{ needs.retrieve-version-parts.outputs.major-version }}
            ${{ secrets.dockerhub-repository }}:${{ needs.retrieve-version-parts.outputs.major-version }}.${{ needs.retrieve-version-parts.outputs.minor-version }}
            ${{ secrets.dockerhub-repository }}:latest
